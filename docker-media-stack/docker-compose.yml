# Profiles: media (movies & TV), audiobooks, recommendarr
# COMPOSE_PROFILES=media,audiobooks,recommendarr docker compose up -d

name: docker-media-stack
services:

  # =================================== SHARED SERVICES ===================================

  vpn:
    ## Read https://github.com/qdm12/gluetun-wiki/tree/main/setup/providers for details on configuring VPN for your service provider.
    profiles: ["media", "audiobooks"]
    container_name: vpn
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_REGIONS=${SERVER_REGIONS}
      - PRIVATE_INTERNET_ACCESS_OPENVPN_ENCRYPTION_PRESET=${PRIVATE_INTERNET_ACCESS_OPENVPN_ENCRYPTION_PRESET}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING}
      - PORT_FORWARD_ONLY=${PORT_FORWARD_ONLY}
      # Push each newly forwarded port to qBittorrent (shares this network namespace).
      # Retries while qBittorrent is still starting; needs bypass_local_auth (set by Ansible)
      - >-
        VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -qO- --retry-connrefused --tries=30 --waitretry=10
        --post-data "json={\"listen_port\":{{PORT}},\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:5080/api/v2/app/setPreferences'
      - DNS_SERVERS=${DNS_SERVERS}
    networks:
      - ${MY_NETWORK}
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # qbittorrent ports
      - "127.0.0.1:5080:5080"
      - 6881:6881
      - 6881:6881/udp
      # prowlarr ports
      - "127.0.0.1:9696:9696"
      - "127.0.0.1:8191:8191" # flaresolverr port
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      # qBittorrent (runs in VPN namespace)
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.middlewares=${ADMIN_MIDDLEWARES}"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=5080"
      # Prowlarr (runs in VPN namespace)
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.middlewares=${ADMIN_MIDDLEWARES}"
      - "traefik.http.routers.prowlarr.service=prowlarr"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  qbittorrent:
    profiles: ["media", "audiobooks"]
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    depends_on:
      vpn:
        condition: service_healthy
    network_mode: service:vpn
    environment:
      - ${PUID}
      - ${PGID}
      - ${TZ}
      - WEBUI_PORT=5080
    volumes:
      - qbittorrent-config:/config
      - torrent-downloads:/downloads
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true

  prowlarr:
    profiles: ["media", "audiobooks"]
    container_name: prowlarr
    image: linuxserver/prowlarr:latest
    depends_on:
      vpn:
        condition: service_healthy
    network_mode: service:vpn
    environment:
      - ${PUID}
      - ${PGID}
      - ${TZ}
    volumes:
      - prowlarr-config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  flaresolverr:
    profiles: ["media", "audiobooks"]
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    depends_on:
      vpn:
        condition: service_healthy
    network_mode: service:vpn
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # =================================== MOVIE/TV SERVICES ===================================

  radarr:
    profiles: ["media"]
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    networks:
      homelab-network:
        ipv4_address: ${RADARR_STATIC_CONTAINER_IP}
    environment:
      - ${PUID}
      - ${PGID}
      - ${TZ}
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - radarr-config:/config
      - torrent-downloads:/downloads
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.middlewares=${ADMIN_MIDDLEWARES}"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"

  sonarr:
    profiles: ["media"]
    image: linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      homelab-network:
        ipv4_address: ${SONARR_STATIC_CONTAINER_IP}
    environment:
      - ${PUID}
      - ${PGID}
      - ${TZ}
    volumes:
      - sonarr-config:/config
      - torrent-downloads:/downloads
    ports:
      - "127.0.0.1:8989:8989"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.middlewares=${ADMIN_MIDDLEWARES}"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

  jellyfin:
    profiles: ["media"]
    image: linuxserver/jellyfin:latest
    container_name: jellyfin
    networks:
      - ${MY_NETWORK}
    environment:
      - ${PUID}
      - ${PGID}
      - ${TZ}
    volumes:
      - jellyfin-config:/config
      - torrent-downloads:/data
    ports:
      - 8096:8096
      - 7359:7359/udp
      - 8920:8920
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

  # Seerr — successor to Jellyseerr/Overseerr (they merged into Seerr).
  # Runs as UID 1000 (not root), so PUID/PGID are not used and the config
  # volume must be owned by 1000:1000. Seerr ships no init process; init: true
  # is required. The "jellyseerr" network alias and Traefik hosts keep old
  # links working. Not public: family request through the Moonfin app, which
  # relays to Seerr via Jellyfin's Moonbase plugin. "requests" is the old
  # tunnel hostname, now home network/Tailscale only.
  seerr:
    profiles: ["media"]
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    networks:
      homelab-network:
        aliases:
          - jellyseerr
    environment:
      - TZ=${TZ}
    volumes:
      - seerr-config:/app/config
    ports:
      - "127.0.0.1:5055:5055"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN}`) || Host(`jellyseerr.${DOMAIN}`) || Host(`requests.${DOMAIN}`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"

  recommendarr:
    profiles: ["recommendarr"]
    container_name: recommendarr
    image: tannermiddleton/recommendarr:latest
    networks:
      - ${MY_NETWORK}
    environment:
      - NODE_ENV=production
      - DOCKER_ENV=true
      - PORT=3000
      - PUBLIC_URL=${RECOMMENDARR_PUBLIC_URL}
      - FORCE_SECURE_COOKIES=true
    volumes:
      - recommendarr-data:/app/server/data
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.recommendarr.rule=Host(`recommendarr.${DOMAIN}`)"
      - "traefik.http.routers.recommendarr.entrypoints=websecure"
      - "traefik.http.routers.recommendarr.middlewares=${ADMIN_MIDDLEWARES}"
      - "traefik.http.services.recommendarr.loadbalancer.server.port=3000"

  # =================================== AUDIOBOOK SERVICES ===================================

  shelfmark:
    profiles: ["audiobooks"]
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    networks:
      - ${MY_NETWORK}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - shelfmark-config:/config
      - torrent-downloads:/books
      - torrent-downloads:/downloads
    ports:
      - "127.0.0.1:8084:8084"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shelfmark.rule=Host(`shelfmark.${DOMAIN}`)"
      - "traefik.http.routers.shelfmark.entrypoints=websecure"
      - "traefik.http.routers.shelfmark.middlewares=${ADMIN_MIDDLEWARES}"
      - "traefik.http.services.shelfmark.loadbalancer.server.port=8084"

  audiobookshelf:
    profiles: ["audiobooks"]
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    networks:
      - ${MY_NETWORK}
    environment:
      - ${PUID}
      - ${PGID}
      - ${TZ}
    volumes:
      - audiobookshelf-config:/config
      - audiobookshelf-metadata:/metadata
      - torrent-downloads:/media
    ports:
      - 13378:80
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audiobookshelf.rule=Host(`audiobookshelf.${DOMAIN}`)"
      - "traefik.http.routers.audiobookshelf.entrypoints=websecure"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"

volumes:
  # Shared services
  torrent-downloads:
  qbittorrent-config:
  prowlarr-config:

  # Movie/TV services
  radarr-config:
  sonarr-config:
  jellyfin-config:
  seerr-config:
  recommendarr-data:

  # Audiobook services
  audiobookshelf-config:
  audiobookshelf-metadata:
  shelfmark-config:

networks:
  homelab-network:
    external: true
