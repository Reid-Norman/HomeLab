name: docker-management-stack
services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    volumes:
      - portainer-data:/data
      - /var/run/docker.sock:/var/run/docker.sock  # nosemgrep: docker-socket-mount — managing containers is its job
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - homelab-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.middlewares=${ADMIN_MIDDLEWARES}"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_CLEANUP=${WATCHTOWER_CLEANUP}
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL}
      - WATCHTOWER_NOTIFICATIONS=${WATCHTOWER_NOTIFICATIONS:-}
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # nosemgrep: docker-socket-mount — pulls images and recreates containers

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - homelab-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.rule=Host(`uptime-kuma.${DOMAIN}`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.middlewares=${ADMIN_MIDDLEWARES}"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # nosemgrep: docker-socket-mount — streams container logs
    networks:
      - homelab-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`dozzle.${DOMAIN}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.middlewares=${ADMIN_MIDDLEWARES}"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

  # Start page at home.${DOMAIN}. Config is committed in ./homepage (read-only).
  # API keys and logins come from homepage.env, which only this container loads
  # (not .env, so the other services here never see them). No Docker socket:
  # status dots come from siteMonitor checks, so Homepage can't read other containers
  homepage:
    image: ghcr.io/gethomepage/homepage:v2
    container_name: homepage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - homepage.env
    environment:
      # homepage:3000 lets Uptime Kuma check it by container name
      - HOMEPAGE_ALLOWED_HOSTS=home.${DOMAIN},homepage:3000
      - LOG_TARGETS=stdout
    volumes:
      - ./homepage:/app/config:ro
    networks:
      - homelab-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`home.${DOMAIN}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.middlewares=${ADMIN_MIDDLEWARES}"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"

volumes:
  portainer-data:
  uptime-kuma-data:

networks:
  homelab-network:
    external: true
