- name: Configure HomeLab services
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all/vault.yml
  roles:
    - role: env_files
      tags: [env]
    - role: cloudflare_tunnel
    - role: cloudflare_dns
    - role: tailscale
    - role: qbittorrent
    - role: prowlarr
    - role: sonarr
    - role: radarr
    - role: jellyfin
    - role: seerr
    - role: recyclarr
    - role: adguard
    - role: traefik
    - role: authelia
    - role: homepage
    - role: uptime_kuma
    - role: semaphore
