# Tailscale runs on the host (Homebrew tailscaled), not in Docker, and its setup
# needs sudo plus a browser login, so it's done by hand once (README: Remote
# access). This role only checks it and says what's missing. It never fails the
# play: remote access is optional
- name: Read Tailscale status
  ansible.builtin.command: "{{ tailscale_bin }} status --json"
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Parse Tailscale status
  ansible.builtin.set_fact:
    tailscale_state: "{{ (tailscale_status.stdout | from_json).BackendState | default('unknown') }}"
    tailscale_self: "{{ (tailscale_status.stdout | from_json).Self | default({}, true) }}"
  when: tailscale_status.rc == 0

# PrimaryRoutes lists the routes this machine both advertises and has had
# approved in the admin console, so a missing route covers both cases
- name: Find missing Tailscale routes
  ansible.builtin.set_fact:
    tailscale_missing_routes: "{{ tailscale_advertise_routes | difference(tailscale_self.PrimaryRoutes | default([], true)) }}"
  when: tailscale_status.rc == 0

- name: Tailscale status
  ansible.builtin.debug:
    msg: >-
      {% if tailscale_status.rc != 0 %}
      Tailscale not installed or not running (optional). Without it, *.{{ vault_domain }}
      only works on the home network. Setup: README, Remote access
      {% elif tailscale_state != 'Running' %}
      Tailscale is {{ tailscale_state }}. Log in: sudo tailscale up
      --advertise-routes={{ tailscale_advertise_routes | join(',') }} --accept-dns=false
      {% elif tailscale_missing_routes | length > 0 %}
      Tailscale is up, but {{ tailscale_missing_routes | join(', ') }} isn't routed. Advertise it with
      sudo tailscale set --advertise-routes={{ tailscale_advertise_routes | join(',') }}, then approve
      it in the admin console (Machines, this Mac, Edit route settings)
      {% else %}
      Tailscale is up and routes {{ tailscale_advertise_routes | join(', ') }}: *.{{ vault_domain }}
      works from any device on your tailnet
      {% endif %}

- name: Warn about Tailscale key expiry
  ansible.builtin.debug:
    msg: >-
      This Mac's Tailscale key expires {{ tailscale_self.KeyExpiry }}, which logs the server out
      of Tailscale. Turn it off: admin console, Machines, this Mac, Disable key expiry
  when:
    - tailscale_status.rc == 0
    - tailscale_state == 'Running'
    - tailscale_self.KeyExpiry is defined
