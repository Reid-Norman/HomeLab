- name: Wait for qBittorrent API
  ansible.builtin.uri:
    url: "http://localhost:5080/api/v2/app/version"
    method: GET
    status_code: [200, 403]
  register: qbt_health
  retries: 12
  delay: 10
  until: qbt_health.status in [200, 403]

- name: Login to qBittorrent
  ansible.builtin.uri:
    url: "http://localhost:5080/api/v2/auth/login"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ qbittorrent_username }}"
      password: "{{ qbittorrent_password }}"
    # qBittorrent 5.2+ returns 204 on success (older versions: 200 "Ok.")
    status_code: [200, 204]
  register: qbt_login
  no_log: true

# Older versions return 200 "Fails." on bad credentials, so status alone
# doesn't prove success — a session cookie does. Its name varies: "SID"
# before 5.2, port-suffixed (e.g. "QBT_SID_5080") from 5.2, so check that
# any cookie was set rather than a specific name
- name: Verify qBittorrent login succeeded
  ansible.builtin.assert:
    that: "(qbt_login.cookies | default({})) | length > 0"
    fail_msg: >-
      qBittorrent login failed (no session cookie). Check that
      qbittorrent_username/qbittorrent_password in the vault match the WebUI,
      and that the IP isn't banned after repeated failures.
    quiet: true

- name: Set qBittorrent session cookie
  ansible.builtin.set_fact:
    qbt_cookie: "{{ qbt_login.cookies_string }}"

- name: Get current qBittorrent preferences
  ansible.builtin.uri:
    url: "http://localhost:5080/api/v2/app/preferences"
    method: GET
    headers:
      Cookie: "{{ qbt_cookie }}"
    status_code: 200
  register: qbt_prefs

- name: Set qBittorrent download path
  ansible.builtin.uri:
    url: "http://localhost:5080/api/v2/app/setPreferences"
    method: POST
    headers:
      Cookie: "{{ qbt_cookie }}"
    body_format: form-urlencoded
    body:
      json: '{"save_path": "{{ qbittorrent_download_path }}"}'
    status_code: [200, 204]
  when: qbt_prefs.json.save_path != qbittorrent_download_path

- name: Set qBittorrent max seeding time
  ansible.builtin.uri:
    url: "http://localhost:5080/api/v2/app/setPreferences"
    method: POST
    headers:
      Cookie: "{{ qbt_cookie }}"
    body_format: form-urlencoded
    body:
      json: '{"max_seeding_time": {{ qbittorrent_max_seeding_time }}}'
    status_code: [200, 204]
  when: qbt_prefs.json.max_seeding_time != qbittorrent_max_seeding_time

# Who may use the API without qBittorrent's own login:
# - localhost, so Gluetun's VPN_PORT_FORWARDING_UP_COMMAND can set the listening
#   port. "Localhost" here is the VPN namespace, shared only by vpn, qbittorrent,
#   prowlarr and flaresolverr
# - with Authelia in front, Traefik's static IP only, so requests that already
#   passed the Authelia login don't hit a second one. Host/LAN traffic arrives
#   from the Docker gateway (172.20.0.1) and other containers from their own IPs,
#   so they still need qBittorrent's login. Never whitelist the whole subnet
- name: Set qBittorrent authentication bypass
  vars:
    qbt_whitelist_enabled: "{{ 'authelia' in traefik_admin_middlewares }}"
    qbt_whitelist: "{{ traefik_static_ip ~ '/32' if qbt_whitelist_enabled else '' }}"
  ansible.builtin.uri:
    url: "http://localhost:5080/api/v2/app/setPreferences"
    method: POST
    headers:
      Cookie: "{{ qbt_cookie }}"
    body_format: form-urlencoded
    body:
      json: "{{ {'bypass_local_auth': true, 'bypass_auth_subnet_whitelist_enabled': qbt_whitelist_enabled | bool,
                 'bypass_auth_subnet_whitelist': qbt_whitelist} | to_json }}"
    status_code: [200, 204]
  when: >-
    not qbt_prefs.json.bypass_local_auth
    or qbt_prefs.json.bypass_auth_subnet_whitelist_enabled != (qbt_whitelist_enabled | bool)
    or (qbt_whitelist_enabled | bool and qbt_prefs.json.bypass_auth_subnet_whitelist != qbt_whitelist)

# Backstop for the Gluetun up command: the port file is empty until the VPN
# has a forwarded port, in which case the sync is skipped
- name: Read Gluetun forwarded port
  ansible.builtin.command: docker exec vpn cat /tmp/gluetun/forwarded_port
  register: qbt_forwarded_port
  changed_when: false
  failed_when: false

- name: Set qBittorrent listening port to the VPN forwarded port
  ansible.builtin.uri:
    url: "http://localhost:5080/api/v2/app/setPreferences"
    method: POST
    headers:
      Cookie: "{{ qbt_cookie }}"
    body_format: form-urlencoded
    body:
      json: '{"listen_port": {{ qbt_forwarded_port.stdout | trim | int }}, "random_port": false, "upnp": false}'
    status_code: [200, 204]
  when:
    - qbt_forwarded_port.rc == 0
    - (qbt_forwarded_port.stdout | trim) is match('^[0-9]+$')
    - qbt_prefs.json.listen_port != (qbt_forwarded_port.stdout | trim | int)

- name: Get existing qBittorrent categories
  ansible.builtin.uri:
    url: "http://localhost:5080/api/v2/torrents/categories"
    method: GET
    headers:
      Cookie: "{{ qbt_cookie }}"
    status_code: 200
  register: qbt_categories

- name: Create qBittorrent categories
  ansible.builtin.uri:
    url: "http://localhost:5080/api/v2/torrents/createCategory"
    method: POST
    headers:
      Cookie: "{{ qbt_cookie }}"
    body_format: form-urlencoded
    body:
      category: "{{ item.name }}"
      savePath: "{{ item.savePath }}"
    status_code: [200, 204]
  loop: "{{ qbittorrent_categories }}"
  when: item.name not in qbt_categories.json
