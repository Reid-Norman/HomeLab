- name: Wait for Prowlarr API
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/system/status"
    method: GET
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    status_code: 200
  register: prowlarr_health
  retries: 12
  delay: 10
  until: prowlarr_health.status == 200

- name: Get existing Prowlarr applications
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/applications"
    method: GET
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    status_code: 200
  register: prowlarr_existing_apps

- name: Extract existing Prowlarr application names
  ansible.builtin.set_fact:
    prowlarr_existing_app_names: >-
      {{ prowlarr_existing_apps.json | map(attribute='name') | list }}

- name: Add Prowlarr application sync targets
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/applications"
    method: POST
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    body_format: json
    body:
      name: "{{ item.name }}"
      syncLevel: "fullSync"
      implementation: "{{ item.implementation }}"
      configContract: "{{ item.implementation }}Settings"
      fields:
        - name: "prowlarrUrl"
          value: "{{ prowlarr_url }}"
        - name: "baseUrl"
          value: "{{ item.baseUrl }}"
        - name: "apiKey"
          value: "{{ item.apiKey }}"
        - name: "syncCategories"
          value: []
    status_code: [200, 201]
  loop: "{{ prowlarr_applications }}"
  # Items contain API keys — print only the app name, hide request/response
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in prowlarr_existing_app_names
  no_log: true

# Same as the Sonarr role: hand Prowlarr's login to Authelia when it's in front
- name: Get Prowlarr host settings
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/config/host"
    method: GET
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    status_code: 200
  register: prowlarr_host_config
  no_log: true  # response includes the stored password and API key

- name: Set Prowlarr authentication method
  vars:
    prowlarr_auth_method: "{{ 'external' if (arr_external_auth and 'authelia' in traefik_admin_middlewares) else 'forms' }}"
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/config/host/{{ prowlarr_host_config.json.id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    body_format: json
    body: "{{ prowlarr_host_config.json | combine({'authenticationMethod': prowlarr_auth_method}) }}"
    status_code: [200, 202]
  no_log: true  # the request body includes Prowlarr's stored password and API key
  when: >-
    (prowlarr_auth_method == 'external' and prowlarr_host_config.json.authenticationMethod != 'external')
    or (prowlarr_auth_method == 'forms' and prowlarr_host_config.json.authenticationMethod == 'external')
