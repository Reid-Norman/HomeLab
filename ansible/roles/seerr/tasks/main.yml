- name: Wait for Seerr API
  ansible.builtin.uri:
    url: "http://localhost:5055/api/v1/status"
    method: GET
    status_code: 200
  register: seerr_health
  retries: 12
  delay: 10
  until: seerr_health.status == 200

- name: Check Seerr initialization status
  ansible.builtin.uri:
    url: "http://localhost:5055/api/v1/settings/public"
    method: GET
    status_code: 200
  register: seerr_public

- name: Check if Seerr is ready for configuration
  ansible.builtin.set_fact:
    seerr_ready: >-
      {{ (seerr_public.json.initialized | default(false))
         and (vault_jellyfin_username | default('') | length > 0)
         and not (vault_jellyfin_username | default('') is match('REPLACE_.*'))
         and (vault_jellyfin_password | default('') | length > 0)
         and not (vault_jellyfin_password | default('') is match('REPLACE_.*')) }}

- name: Skip if Seerr not ready
  ansible.builtin.debug:
    msg: >-
      Seerr skipped —
      {% if not (seerr_public.json.initialized | default(false)) %}
      setup wizard not completed. Visit http://localhost:5055 first.
      {% else %}
      Jellyfin credentials not in vault. Run 'make generate-creds STACK=media'.
      {% endif %}
  when: not seerr_ready

- name: Configure Seerr
  when: seerr_ready
  block:
    - name: Login to Seerr via Jellyfin
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/auth/jellyfin"
        method: POST
        body_format: json
        body:
          username: "{{ vault_jellyfin_username }}"
          password: "{{ vault_jellyfin_password }}"
        status_code: 200
      register: seerr_login
      no_log: true

    - name: Set Seerr session cookie
      ansible.builtin.set_fact:
        seerr_cookie: "{{ seerr_login.cookies_string }}"

    - name: Get existing Seerr Radarr settings
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/settings/radarr"
        method: GET
        headers:
          Cookie: "{{ seerr_cookie }}"
        status_code: 200
      register: seerr_radarr

    - name: Add Radarr to Seerr
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/settings/radarr"
        method: POST
        headers:
          Cookie: "{{ seerr_cookie }}"
        body_format: json
        body:
          name: "Radarr"
          hostname: "radarr"
          port: 7878
          apiKey: "{{ radarr_api_key }}"
          useSsl: false
          activeProfileId: 1
          activeDirectory: "{{ radarr_root_folders[0].path }}"
          is4k: false
          minimumAvailability: "released"
          isDefault: true
        status_code: [200, 201]
      when: seerr_radarr.json | length == 0

    - name: Get existing Seerr Sonarr settings
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/settings/sonarr"
        method: GET
        headers:
          Cookie: "{{ seerr_cookie }}"
        status_code: 200
      register: seerr_sonarr

    - name: Add Sonarr to Seerr
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/settings/sonarr"
        method: POST
        headers:
          Cookie: "{{ seerr_cookie }}"
        body_format: json
        body:
          name: "Sonarr"
          hostname: "sonarr"
          port: 8989
          apiKey: "{{ sonarr_api_key }}"
          useSsl: false
          activeProfileId: 1
          activeDirectory: "{{ sonarr_root_folders[0].path }}"
          activeAnimeProfileId: 1
          activeAnimeDirectory: "{{ sonarr_root_folders[1].path | default(sonarr_root_folders[0].path) }}"
          is4k: false
          enableSeasonFolders: true
          isDefault: true
        status_code: [200, 201]
      when: seerr_sonarr.json | length == 0

    # New users are family members signing in with their Jellyfin account (from the
    # Moonfin app). Request + auto-approve only, with per-user quotas. The POST is a
    # merge, so only these keys change
    - name: Get Seerr main settings
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/settings/main"
        method: GET
        headers:
          Cookie: "{{ seerr_cookie }}"
        status_code: 200
      register: seerr_main
      no_log: true

    # One expression, so the numbers stay ints (nested "{{ }}" values become strings
    # and would never compare equal)
    - name: Build wanted Seerr main settings
      ansible.builtin.set_fact:
        seerr_main_wanted: >-
          {{ {'mediaServerLogin': true,
              'newPlexLogin': true,
              'defaultPermissions': seerr_default_permissions | int,
              'defaultQuotas': {
                'movie': {'quotaLimit': seerr_quota_movies.limit | int, 'quotaDays': seerr_quota_movies.days | int},
                'tv': {'quotaLimit': seerr_quota_tv.limit | int, 'quotaDays': seerr_quota_tv.days | int}}} }}

    - name: Set Seerr defaults for new users
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/settings/main"
        method: POST
        headers:
          Cookie: "{{ seerr_cookie }}"
        body_format: json
        body: "{{ seerr_main_wanted }}"
        status_code: 200
      when: seerr_main.json | combine(seerr_main_wanted, recursive=true) != seerr_main.json
      changed_when: true
      no_log: true

    - name: Get Seerr Jellyfin settings
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/settings/jellyfin"
        method: GET
        headers:
          Cookie: "{{ seerr_cookie }}"
        status_code: 200
      register: seerr_jellyfin
      no_log: true

    # "Play on Jellyfin" links point at the public Jellyfin, not the container
    - name: Set Seerr's external Jellyfin URL
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/settings/jellyfin"
        method: POST
        headers:
          Cookie: "{{ seerr_cookie }}"
        body_format: json
        body:
          externalHostname: "https://jellyfin.{{ vault_domain }}"
        status_code: 200
      when: seerr_jellyfin.json.externalHostname | default('') != 'https://jellyfin.' + vault_domain
      changed_when: true
      no_log: true
